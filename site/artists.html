<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artists — Painting Cabinet</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #11100e;
      color: #e8dcc8;
      font-family: Georgia, "Times New Roman", serif;
    }
    header, main { max-width: 720px; margin: 0 auto; padding: 24px 20px; }
    a { color: #d4c09a; }
    h1 { font-weight: normal; }
    .schools { list-style: none; padding: 0; margin: 2rem 0; }
    .schools li { margin: 0 0 12px; }
    .schools a {
      display: block;
      padding: 16px 18px;
      border: 1px solid #3a342c;
      text-decoration: none;
      color: #e8dcc8;
    }
    .schools a:hover { border-color: #d4c09a; }
    .count { color: #8a7f70; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="index.html">Home</a> ·
      Artists ·
      <a href="viewer.html">Viewer</a> ·
      <a href="about.html">About</a>
    </nav>
    <h1>Artists</h1>
    <p>Choose a school.</p>
  </header>
  <main>
    <ul class="schools" id="schools"></ul>
  </main>
  <script>
    const labels = {
      flemish: "Flemish",
      dutch: "Dutch",
      french: "French",
      spanish: "Spanish",
      italian: "Italian"
    };
    const order = ["flemish", "dutch", "french", "spanish", "italian"];

    fetch("../data/artists.json")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        const artists = data.artists || [];
        const counts = {};
        artists.forEach(function (artist) {
          counts[artist.school] = (counts[artist.school] || 0) + 1;
        });
        const list = document.getElementById("schools");
        const schools = order.slice();
        Object.keys(counts).forEach(function (key) {
          if (schools.indexOf(key) === -1) schools.push(key);
        });
        schools.forEach(function (key) {
          if (!counts[key]) return;
          const item = document.createElement("li");
          const label = labels[key] || key;
          item.innerHTML =
            "<a href='artists-school.html?school=" + encodeURIComponent(key) + "'>" +
            label + " <span class='count'>(" + counts[key] + ")</span></a>";
          list.appendChild(item);
        });
      });
  </script>
</body>
</html>
