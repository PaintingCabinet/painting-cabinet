<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painting Cabinet</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap');
:root{--bg:#0c0a08;--elev:#17130f;--border:#382f22;--text:#ece1cd;--dim:#b9ab8f;--faint:#83765f;--accent:#d9b56d;--accent-dim:#a5895a;--serif:'Playfair Display',Georgia,'Times New Roman',serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none;transition:color .2s var(--ease)}
a:hover{color:var(--text)}
.page{min-height:100vh;display:flex;flex-direction:column;max-width:1240px;margin:0 auto;padding:0 28px}
.nav{display:flex;gap:1.25rem;padding:18px 0;font-size:.72rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.nav a{color:var(--dim)}
.nav a:hover,.nav a.here{color:var(--accent)}
.hero{flex:1;display:grid;grid-template-columns:1fr;gap:40px;align-items:center;justify-items:center;text-align:center;padding:24px 0 40px;animation:rise .9s .3s var(--ease) both}
.hero.has-art{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);justify-items:stretch;text-align:left}
h1{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(2.6rem,6vw,4.4rem);line-height:1.08;margin:0 0 16px}
.lede{color:var(--dim);font-size:1.05rem;line-height:1.65;max-width:30rem;margin:0 auto 28px}
.has-art .lede{margin-left:0}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.has-art .actions{justify-content:flex-start}
.btn{display:inline-block;padding:11px 22px;border:1px solid var(--border);border-radius:999px;background:var(--elev);color:var(--text);font-size:.82rem;letter-spacing:.02em;transition:border-color .2s var(--ease),color .2s var(--ease),transform .15s var(--ease)}
.btn:hover{border-color:var(--accent-dim);color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a140c;font-weight:500}
.btn.primary:hover{background:#e6c680;color:#1a140c}
.show{display:none;margin:0;width:100%}
.has-art .show{display:block}
.frame{position:relative;height:min(62vh,600px)}
.frame img{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;opacity:0;transition:opacity 1s ease;filter:drop-shadow(0 18px 44px rgba(0,0,0,.55))}
.frame img.on{opacity:1}
figcaption{text-align:center;padding-top:16px;min-height:3.4rem}
.t{display:block;font-family:var(--serif);font-style:italic;font-size:1.05rem;margin-bottom:3px}
.by{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.by:hover{color:var(--accent)}
.dots{display:flex;justify-content:center;gap:8px;margin-top:10px}
.dots button{width:7px;height:7px;padding:0;border:0;border-radius:50%;background:var(--border);cursor:pointer;transition:background .3s,transform .3s}
.dots button.on{background:var(--accent);transform:scale(1.3)}
footer{padding:18px 0 26px;font-size:.72rem;letter-spacing:.04em;color:var(--faint);text-align:center}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:860px){.page{padding:0 16px}.hero.has-art{grid-template-columns:1fr;text-align:center;justify-items:center}.has-art .actions{justify-content:center}.has-art .lede{margin-left:auto}.frame{height:48vh}}
@media(prefers-reduced-motion:reduce){.hero{animation:none}}
</style>
</head>
<body>
<div class="page">
  <nav class="nav">
    <a href="index.html" class="here">Home</a>
    <a href="artists.html">Artists</a>
    <a href="viewer.html">Viewer</a>
    <a href="about.html">About</a>
  </nav>
  <main class="hero" id="hero">
    <section>
      <h1>Painting Cabinet</h1>
      <p class="lede">A free educational viewer for Flemish, Dutch, and French painting.</p>
      <div class="actions">
        <a class="btn primary" href="viewer.html">Open the viewer</a>
        <a class="btn" href="artists.html">Browse artists</a>
      </div>
    </section>
    <figure class="show">
      <div class="frame"><img id="a" alt=""><img id="b" alt=""></div>
      <figcaption><span class="t" id="capT"></span><a class="by" id="capBy" href="artists.html"></a></figcaption>
      <div class="dots" id="dots"></div>
    </figure>
  </main>
  <footer>Pictures from Wikimedia Commons &middot; Facts from Wikidata &middot; <a href="about.html">About this site</a></footer>
</div>
<script>
(function () {
  var INTERVAL = 6500;
  var hero = document.getElementById("hero"), A = document.getElementById("a"), B = document.getElementById("b");
  var capT = document.getElementById("capT"), capBy = document.getElementById("capBy"), dotsEl = document.getElementById("dots");
  var slides = [], idx = 0, useA = true, timer = null, token = 0, misses = 0;

  function sized(u) {
    var b = (u || "").split("?")[0];
    return b.indexOf("Special:FilePath/") > -1 ? b + "?width=1400" : u;
  }
  function shuffle(l) {
    for (var i = l.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = l[i]; l[i] = l[j]; l[j] = t; }
  }
  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(function () { show(idx + 1); }, INTERVAL);
  }
  function show(i) {
    idx = (i + slides.length) % slides.length;
    var w = slides[idx], inc = useA ? B : A, out = useA ? A : B, my = ++token;
    function reveal() {
      if (my !== token) return;
      inc.onload = inc.onerror = null;
      var nw = inc.naturalWidth || 0, nh = inc.naturalHeight || 0;
      if (!nw || Math.max(nw, nh) < 1000) {
        if (++misses >= slides.length) { hero.classList.remove("has-art"); return; }
        show(idx + 1);
        return;
      }
      misses = 0;
      inc.alt = w.title || "";
      inc.classList.add("on");
      out.classList.remove("on");
      useA = !useA;
      capT.textContent = w.title || "Untitled";
      capBy.textContent = w.artist_name || "";
      capBy.href = "artist.html?name=" + encodeURIComponent(w.artist_name || "") + "&school=" + encodeURIComponent(w.school || "");
      for (var k = 0; k < dotsEl.children.length; k++) dotsEl.children[k].className = k === idx ? "on" : "";
      schedule();
      var nx = slides[(idx + 1) % slides.length];
      if (nx) (new Image()).src = sized(nx.image);
    }
    inc.onload = reveal;
    inc.onerror = reveal;
    var u = sized(w.image);
    if (inc.getAttribute("src") === u && inc.complete) reveal(); else inc.src = u;
  }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) clearTimeout(timer); else if (slides.length > 1) schedule();
  });

  fetch("../data/featured.json")
    .then(function (r) { return r.json(); })
    .then(function (d) {
      slides = (d.featured || []).filter(function (w) { return w && w.image; });
      if (!slides.length) return;
      shuffle(slides);
      hero.classList.add("has-art");
      slides.forEach(function (_, i) {
        var b = document.createElement("button");
        b.type = "button";
        b.setAttribute("aria-label", "Show painting " + (i + 1));
        b.onclick = function () { show(i); };
        dotsEl.appendChild(b);
      });
      show(0);
    })
    .catch(function () {});
})();
</script>
</body>
</html>
